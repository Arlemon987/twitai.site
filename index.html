  <!-- Floating "Install App" Button (Bottom Right) -->

  <!-- Settings Modal -->
  <div id="configModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[60] hidden items-center justify-center p-4">
    <div class="glass-panel border border-slate-700/80 rounded-3xl max-w-lg w-full p-6 shadow-2xl flex flex-col gap-5 max-h-[90vh] overflow-y-auto custom-scrollbar">
      
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-sky-500/10 border border-sky-500/20 flex items-center justify-center text-sky-400">

          <h3 class="text-base font-bold text-white">Generation Rules</h3>
        </div>
        <button id="closeConfigModal" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-xs font-medium text-slate-400 block mb-1.5">Reply Variations</label>
          <input type="number" id="replyCountInput" min="2" max="8" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-white focus:border-sky-500 outline-none transition">
        </div>
        <div>
          <label class="text-xs font-medium text-slate-400 block mb-1.5">Language</label>
          <select id="languageSelect" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-white focus:border-sky-500 outline-none transition">
            <option value="auto">Auto-detect</option>
            <option value="english">English Only</option>
            <option value="vietnamese">Vietnamese</option>
            <option value="chinese">Chinese</option>
          </select>
        </div>
      </div>

      <div>
        <label class="text-xs font-medium text-slate-400 block mb-1.5">Word Length Range</label>
        <div class="flex items-center gap-3">
          <input type="number" id="minWordsInput" min="5" max="30" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-white text-center focus:border-sky-500 outline-none transition">
          <span class="text-slate-500 text-xs uppercase tracking-wider font-semibold">to</span>
          <input type="number" id="maxWordsInput" min="10" max="60" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-white text-center focus:border-sky-500 outline-none transition">
          <span class="text-slate-500 text-xs">words</span>
        </div>

      <div>
        <label class="text-xs font-medium text-slate-400 block mb-1.5">Reply Tone & Style</label>
        <select id="toneSelector" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-white focus:border-sky-500 outline-none transition">
          <option value="balanced">Balanced CT (Organic & Casual)</option>
          <option value="technical">Technical / Protocol Deep-dive</option>
          <option value="defi">DeFi & Capital Mechanics</option>
          <option value="skeptical">Constructive & Analytical Skeptic</option>
          <option value="humor">Light CT Irony / Banter</option>
          <option value="bullish_rational">Rational Conviction</option>
        </select>
      </div>

      <div>
        <label class="text-xs font-medium text-slate-400 block mb-1.5">Include Ticker or Handle (Optional)</label>
        <input type="text" id="projectTag" placeholder="e.g. $BTC, @arbitrum" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-white focus:border-sky-500 outline-none transition">
      </div>

      <button id="saveConfigBtn" class="w-full py-3 rounded-xl bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-semibold text-sm transition shadow-lg shadow-sky-500/20">Apply Settings</button>
    </div>
  </div>

  <script>
    // --- PWA Service Worker & Install Flow ---
    let deferredPrompt = null;
    const installBtn = document.getElementById('floatingInstallBtn');

    // Register empty Service Worker to fulfill Chrome's PWA install criteria
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swBlob = new Blob([`
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('activate', e => self.clients.claim());
          self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
        `], { type: 'application/javascript' });
        
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err => console.log('SW registration note:', err));
      });
    }

    // Capture the Chrome native install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'flex';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      } else {
        showToast('App can be installed directly from your browser menu (⋮) -> "Install Twit AI"');
      }
    });

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
      showToast('Twit AI installed successfully!');
    });

    // --- State ---
    const state = {
      chats: [],
      currentChatId: null,
      settings: {
        replyCount: 5,
        minWords: 10,
        maxWords: 18,
        tone: 'balanced',
        tag: '',
        language: 'auto'
      }
    };

    function loadState() {
      const saved = localStorage.getItem('twitAiState');
      if (saved) {
        const parsed = JSON.parse(saved);
        state.chats = parsed.chats || [];
        state.currentChatId = parsed.currentChatId;
        state.settings = { ...state.settings, ...(parsed.settings || {}) };
      }
      if (state.chats.length === 0) {
        createNewChat(false);
      }
    }

    function saveState() {
      localStorage.setItem('twitAiState', JSON.stringify(state));
    }

    // --- Chat Management ---
    function createNewChat(render = true) {
      const newChat = {
        id: Date.now().toString(),
        title: "New Tweet Reply",
        messages: []
      };
      state.chats.unshift(newChat);
      state.currentChatId = newChat.id;
      saveState();
      if (render) {
        renderChatList();
        renderMessages();
      }
    }

    function selectChat(chatId) {
      state.currentChatId = chatId;
      saveState();
      renderChatList();
      renderMessages();
      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('sidebarOverlay').classList.add('hidden');
    }

    function deleteChat(chatId, e) {
      e.stopPropagation();
      state.chats = state.chats.filter(c => c.id !== chatId);
      if (state.currentChatId === chatId) {
        state.currentChatId = state.chats[0]?.id || null;
        if (!state.currentChatId) createNewChat();
      }
      saveState();
      renderChatList();
      renderMessages();
    }

    // --- Renderers ---
    function renderChatList() {
      const list = document.getElementById('chatList');
      list.innerHTML = '';
      state.chats.forEach(chat => {
        const isActive = chat.id === state.currentChatId;
        const div = document.createElement('div');
        div.className = `group flex items-center justify-between px-3 py-2.5 rounded-xl cursor-pointer text-xs font-medium transition ${
          isActive 
            ? 'bg-sky-500/15 text-sky-300 border border-sky-500/30' 
            : 'text-slate-400 hover:bg-slate-800/40 hover:text-slate-200'
        }`;
        div.onclick = () => selectChat(chat.id);
        
        div.innerHTML = `
          <div class="flex items-center gap-2.5 truncate">
            <i class="fa-regular fa-comment-dots ${isActive ? 'text-sky-400' : 'text-slate-500'}"></i>
            <span class="truncate">${escapeHtml(chat.title)}</span>
          </div>
          <button class="text-slate-500 hover:text-rose-400 opacity-0 group-hover:opacity-100 transition p-1" onclick="deleteChat('${chat.id}', event)">
            <i class="fa-regular fa-trash-can"></i>
          </button>
        `;
        list.appendChild(div);
      });
    }

    function renderMessages() {
      const container = document.getElementById('messages');
      container.innerHTML = '';
      const chat = state.chats.find(c => c.id === state.currentChatId);
      
      if (!chat || chat.messages.length === 0) {
        container.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-center pt-20 pb-10 px-4">
            
            <div class="relative mb-5">
              <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-sky-500/20 to-indigo-500/20 border border-sky-500/30 flex items-center justify-center text-3xl text-sky-400 glow-brand">
                <svg class="w-10 h-10" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M8 28L14 24H30C32.2091 24 34 22.2091 34 20V12C34 9.79086 32.2091 8 30 8H10C7.79086 8 6 9.79086 6 12V26C6 27.1046 6.89543 28 8 28Z" stroke="url(#hero_grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M14 16L18 20M18 16L14 20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
                  <circle cx="25" cy="18" r="2.5" fill="#818cf8"/>
                  <defs>
                    <linearGradient id="hero_grad" x1="6" y1="8" x2="34" y2="28" gradientUnits="userSpaceOnUse">
                      <stop stop-color="#38BDF8"/>
                      <stop offset="1" stop-color="#818CF8"/>
                    </linearGradient>
                  </defs>
                </svg>
              </div>
            </div>

            <h2 class="text-2xl font-black bg-gradient-to-r from-white via-slate-100 to-sky-200 bg-clip-text text-transparent mb-1">Twit AI</h2>
            <p class="text-sm font-semibold text-sky-400 mb-3 tracking-wide">This site is for Generating Tweet Reply</p>
            <p class="text-xs text-slate-400 max-w-md leading-relaxed mb-6">
              Paste the plain text of the tweet you want to reply to. Twit AI crafts non-generic, high-signal responses designed to boost visibility.
            </p>
            
            <div class="flex flex-wrap justify-center gap-2">
              <span class="text-[11px] px-3 py-1.5 rounded-xl bg-slate-900/80 border border-slate-800 text-slate-300 flex items-center gap-1.5">
                <i class="fa-solid fa-file-lines text-sky-400"></i> Pure Tweet Text (No Links)
              </span>
              <span class="text-[11px] px-3 py-1.5 rounded-xl bg-slate-900/80 border border-slate-800 text-slate-300 flex items-center gap-1.5">
                <i class="fa-solid fa-shield-halved text-emerald-400"></i> Anti-Bot Patterning
              </span>
            </div>
          </div>
        `;
        return;
      }

      chat.messages.forEach(msg => {
        const div = document.createElement('div');
        div.className = msg.role === 'user' ? 'flex justify-end' : 'flex justify-start';
        
        if (msg.role === 'user') {
          div.innerHTML = `
            <div class="bg-gradient-to-r from-sky-600/25 to-indigo-600/25 border border-sky-500/30 rounded-2xl rounded-br-sm p-4 max-w-[85%] text-xs md:text-sm text-slate-100 shadow-xl leading-relaxed whitespace-pre-wrap">
              <div class="flex items-center gap-2 text-[10px] text-sky-400 font-mono mb-1.5">
                <i class="fa-brands fa-x-twitter"></i> <span>Original Tweet Text:</span>
              </div>
              ${escapeHtml(msg.content)}
            </div>
          `;
        } else {
          div.innerHTML = `<div class="max-w-full w-full space-y-3"></div>`;
          const replyContainer = div.querySelector('div');
          
          if (msg.loading) {
            replyContainer.innerHTML = `
              <div class="glass-panel rounded-2xl p-4 flex items-center gap-3 text-slate-300 text-xs border-slate-800">
                <div class="w-4 h-4 border-2 border-sky-500 border-t-transparent rounded-full animate-spin"></div> 
                <span>Generating high-engagement replies...</span>
              </div>
            `;
          } else {
            msg.content.forEach((replyText) => {
              const card = document.createElement('div');
              card.className = "glass-panel glass-card-interactive rounded-2xl p-4 group relative";
              
              const wCount = countWords(replyText);
              const inRange = wCount >= state.settings.minWords && wCount <= state.settings.maxWords;
              const tweetIntentUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(replyText)}`;
              
              card.innerHTML = `
                <div class="flex items-center justify-between gap-2 mb-2.5">
                  <span class="text-[10px] font-mono font-semibold px-2.5 py-0.5 rounded-full ${inRange ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/10 text-amber-400 border border-amber-500/30'}">
                    ${wCount} words
                  </span>
                  <div class="flex items-center gap-1.5">
                    <a href="${tweetIntentUrl}" target="_blank" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-[#1d9bf0] text-slate-300 hover:text-white text-[11px] font-medium transition flex items-center gap-1.5 border border-slate-700/60 shadow-sm">
                      <i class="fa-brands fa-x-twitter text-[10px]"></i> Tweet
                    </a>
                    <button class="copy-btn px-2.5 py-1 rounded-lg bg-sky-500/20 hover:bg-sky-500 text-sky-300 hover:text-white text-[11px] font-medium transition flex items-center gap-1.5 border border-sky-500/30 hover:border-transparent shadow-sm">
                      <i class="fa-regular fa-copy text-[10px]"></i> Copy
                    </button>
                  </div>
                </div>
                <div class="text-xs md:text-sm text-slate-200 font-mono leading-relaxed select-all">${escapeHtml(replyText)}</div>
              `;
              
              card.querySelector('.copy-btn').addEventListener('click', () => {
                copyToClipboard(replyText);
                showToast('Copied reply to clipboard!');
              });
              
              replyContainer.appendChild(card);
            });
          }
        }
        container.appendChild(div);
      });
      
      const chatContainer = document.getElementById('chatContainer');
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // --- Helpers ---
    function countWords(str) {
      if (!str) return 0;
      return str.replace(/[#@*`]/g, '').trim().match(/\S+/g)?.length || 0;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function sanitizeTweetInput(raw) {
      return raw.replace(/https?:\/\/\S+/gi, '').trim();
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text);
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
      }
    }

    function showToast(message) {
      let toast = document.getElementById('toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'toast';
        toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-full bg-sky-500 text-white font-semibold text-xs shadow-2xl transition-all transform translate-y-20 opacity-0 pointer-events-none z-[80] flex items-center gap-2 border border-sky-300/40';
        document.body.appendChild(toast);
      }
      toast.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>${message}</span>`;
      toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
      clearTimeout(toast.timeoutId);
      toast.timeoutId = setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
      }, 2200);
    }

    function parseReplies(rawText) {
      const replies = [];
      const codeBlockRegex = /```(?:[a-zA-Z]*\n)?([\s\S]*?)```/g;
      let match;
      while ((match = codeBlockRegex.exec(rawText)) !== null) {
        const text = match[1].trim();
        if (text) replies.push(text);
      }
      if (replies.length === 0) {
        return rawText.split('\n').map(l => l.trim()).filter(l => l.length > 5).slice(0, state.settings.replyCount);
      }
      return replies;
    }

    // --- Message Send Flow ---
    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const cleanTweet = sanitizeTweetInput(input.value);

      if (!cleanTweet) {
        showToast('Please paste the tweet text (no URLs)');
        return;
      }

      const chat = state.chats.find(c => c.id === state.currentChatId);
      if (!chat) return;

      chat.messages.push({ role: 'user', content: cleanTweet });
      chat.messages.push({ role: 'assistant', content: [], loading: true });
      
      if (chat.messages.length === 2) {
        chat.title = cleanTweet.substring(0, 30) + (cleanTweet.length > 30 ? '...' : '');
      }

      input.value = '';
      input.style.height = 'auto';
      updateCounters('');
      saveState();
      renderChatList();
      renderMessages();

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            tweet: cleanTweet,
            minWords: state.settings.minWords,
            maxWords: state.settings.maxWords,
            replyCount: state.settings.replyCount,
            tone: state.settings.tone,
            tag: state.settings.tag,
            language: state.settings.language
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Generation failed');

        const parsed = parseReplies(data.text);
        chat.messages[chat.messages.length - 1] = { role: 'assistant', content: parsed, loading: false };
        saveState();
        renderMessages();
      } catch (error) {
        chat.messages[chat.messages.length - 1] = { role: 'assistant', content: [`Error: ${error.message}`], loading: false };
        saveState();
        renderMessages();
        showToast(error.message);
      }
    }

    function updateCounters(str) {
      const chars = str.length;
      const words = countWords(str);
      document.getElementById('charCount').textContent = `${chars} chars | ${words} words`;
    }

    // --- Event Listeners ---
    document.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderChatList();
      renderMessages();

      // Config state
      document.getElementById('replyCountInput').value = state.settings.replyCount;
      document.getElementById('minWordsInput').value = state.settings.minWords;
      document.getElementById('maxWordsInput').value = state.settings.maxWords;
      document.getElementById('toneSelector').value = state.settings.tone;
      document.getElementById('projectTag').value = state.settings.tag;
      document.getElementById('languageSelect').value = state.settings.language;

      // Sidebar events
      document.getElementById('newChatBtn').addEventListener('click', () => createNewChat());
      document.getElementById('toggleSidebar').addEventListener('click', () => {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        sidebar.classList.toggle('-translate-x-full');
        overlay.classList.toggle('hidden');
      });
      document.getElementById('sidebarOverlay').addEventListener('click', () => {
        document.getElementById('sidebar').classList.add('-translate-x-full');
        document.getElementById('sidebarOverlay').classList.add('hidden');
      });

      // Paste button logic
      document.getElementById('pasteBtn').addEventListener('click', async () => {
        try {
          const text = await navigator.clipboard.readText();
          const input = document.getElementById('chatInput');
          input.value = sanitizeTweetInput(text);
          input.focus();
          updateCounters(input.value);
        } catch {
          showToast('Clipboard access denied. Please paste manually.');
        }
      });

      // Chat input
      const input = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      
      input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = input.scrollHeight + 'px';
        updateCounters(input.value);
      });
      
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
      sendBtn.addEventListener('click', sendMessage);

      // Modal events
      const configModal = document.getElementById('configModal');
      document.getElementById('configBtn').addEventListener('click', () => configModal.classList.remove('hidden'));
      document.getElementById('closeConfigModal').addEventListener('click', () => configModal.classList.add('hidden'));
      document.getElementById('saveConfigBtn').addEventListener('click', () => {
        state.settings.replyCount = parseInt(document.getElementById('replyCountInput').value) || 5;
        state.settings.minWords = parseInt(document.getElementById('minWordsInput').value) || 10;
        state.settings.maxWords = parseInt(document.getElementById('maxWordsInput').value) || 18;
        state.settings.tone = document.getElementById('toneSelector').value;
        state.settings.tag = document.getElementById('projectTag').value.trim();
        state.settings.language = document.getElementById('languageSelect').value;
        saveState();
        configModal.classList.add('hidden');
        showToast('Settings saved!');
      });
    });
  </script>
</body>
</html>
