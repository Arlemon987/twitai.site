<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Twit AI — Tweet Reply Generator</title>
  <meta name="description" content="Twit AI generates natural replies for X and Twitter.">
  <meta name="theme-color" content="#070a12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Twit AI">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM9 11H7V9h2v2zm4 0h-2V9h2v2zm4 0h-2V9h2v2z'/></svg>">

  <!-- REAL manifest. A data: URI manifest is never installable in Chrome. -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <script>
    /* Capture the install event as early as possible — Chrome can fire it
       before the module script below has parsed. */
    window.__deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", e => {
      e.preventDefault();
      window.__deferredPrompt = e;
      document.dispatchEvent(new CustomEvent("pwa-installable"));
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js", { scope: "/" })
          .catch(err => console.warn("Twit AI service worker unavailable. Ensure /sw.js exists at the site root.", err));
      });
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #070a12;
      color: #e2e8f0;
      overflow: hidden;
      position: fixed;
      inset: 0;
      touch-action: manipulation;
    }

    /* Animated background orbs */
    .bg-orbs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .bg-orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: .25; will-change: transform; }
    .bg-orb-1 { width: 400px; height: 400px; background: radial-gradient(circle,#0ea5e9,transparent 70%); top: -10%; left: -5%; animation: orbFloat1 25s ease-in-out infinite; }
    .bg-orb-2 { width: 350px; height: 350px; background: radial-gradient(circle,#6366f1,transparent 70%); bottom: -10%; right: -5%; animation: orbFloat2 30s ease-in-out infinite; }
    .bg-orb-3 { width: 300px; height: 300px; background: radial-gradient(circle,#06b6d4,transparent 70%); top: 40%; left: 50%; animation: orbFloat3 20s ease-in-out infinite; }
    @keyframes orbFloat1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(60px,80px) scale(1.15)} }
    @keyframes orbFloat2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-80px,-60px) scale(1.2)} }
    @keyframes orbFloat3 { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-30%,-70%) scale(.85)} }

    .grid-overlay {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(51,65,85,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(51,65,85,.07) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 30%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 30%, transparent 100%);
    }

    .glass { background: rgba(9,13,22,.82); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(51,65,85,.55); }
    .glass-strong { background: rgba(9,13,22,.92); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(51,65,85,.6); }

    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }
    .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #334155 transparent; }

    .modal-backdrop { background: rgba(0,0,0,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

    .safe-top { padding-top: max(0px, env(safe-area-inset-top)); }
    .safe-bottom { padding-bottom: max(.5rem, env(safe-area-inset-bottom)); }
    .safe-left { padding-left: max(0px, env(safe-area-inset-left)); }
    .safe-bottom-nav { padding-bottom: max(.5rem, env(safe-area-inset-bottom)); }

    .glow-sky { box-shadow: 0 0 30px rgba(14,165,233,.25), 0 0 60px rgba(14,165,233,.1); }
    .gradient-text { background: linear-gradient(135deg,#38bdf8,#818cf8,#22d3ee); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
